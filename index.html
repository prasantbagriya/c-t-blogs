  <body>

    <!-- React App -->

    <!-- Spline 3D Viewer — lazy loaded ONLY when needed -->
    <script>
      // Load Spline only when user scrolls or interacts (saves ~200KB on initial load)
      var splineLoaded = false;
      function loadSpline() {
        if (splineLoaded) return;
        splineLoaded = true;
        var s = document.createElement('script');
        s.type = 'module';
        s.src = 'https://unpkg.com/@splinetool/viewer@1.0.17/build/spline-viewer.js';
        document.head.appendChild(s);
      }
      window.addEventListener('scroll', loadSpline, { once: true, passive: true });
      window.addEventListener('mousemove', loadSpline, { once: true, passive: true });
    </script>
    <script>
      (function() {
        var loaded = false;
        function loadNonCriticalScripts() {
          if (loaded) return;
          loaded = true;

          window.dataLayer = window.dataLayer || [];
          window.gtag = window.gtag || function(){ dataLayer.push(arguments); };

          var ga = document.createElement('script');
          ga.async = true;
          ga.src = 'https://www.googletagmanager.com/gtag/js?id=G-P9267BP0W6';
          ga.onload = function() {
            gtag('js', new Date());
            gtag('config', 'G-P9267BP0W6', { send_page_view: true });
          };
          document.head.appendChild(ga);

          var ads = document.createElement('script');
          ads.async = true;
          ads.crossOrigin = 'anonymous';
          ads.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1798439945710344';
          document.head.appendChild(ads);

          var widget = document.createElement('script');
          widget.type = 'module';
          widget.async = true;
          widget.src = '/sdk/widget.js';
          widget.dataset.id = '1b4b3546-32f3-456d-9f97-ed657d5db994';
          document.body.appendChild(widget);
        }

        var schedule = function(cb) { return setTimeout(cb, 12000); };
        window.addEventListener('load', function() { schedule(loadNonCriticalScripts); });
        window.addEventListener('scroll', loadNonCriticalScripts, { once: true, passive: true });
        window.addEventListener('pointerdown', loadNonCriticalScripts, { once: true, passive: true });
      })();
    </script>
