<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inquiry Dashboard | Leads Manager — ChatWizs</title>
    <meta name="description" content="ChatWizs admin dashboard for managing customer inquiries and leads." />
    <!-- SECURITY: Admin dashboard must NOT be indexed by search engines -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />

    <!-- Stylesheet (local — no render blocking penalty) -->
    <link rel="stylesheet" href="style.css">

    <!-- Preconnect for faster 3rd-party connections -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">

    <!-- FIX: Google Fonts — Non-blocking (PageSpeed 100 pattern) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    </noscript>

    <!-- FIX: FontAwesome — Non-blocking (was render-blocking 30KB!) -->
    <link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </noscript>

    <!-- FIX: Critical CSS inline to prevent FOUC -->
    <style>
      *,*::before,*::after{box-sizing:border-box}
      html,body{margin:0;padding:0;min-height:100vh}
      body{font-family:'Inter',ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
      /* Dashboard layout reserve space - prevents CLS */
      .dashboard-layout{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
      .sidebar{min-height:100vh}
    </style>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="brand" style="text-align: left; margin-bottom: 3rem;">
                <h1>Leads</h1>
            </div>
            <nav>
                <div style="color: var(--text-muted); font-size: 0.75rem; font-weight: 600; text-transform: uppercase; margin-bottom: 1rem; letter-spacing: 0.05em;">Menu</div>
                <a href="#" style="display: flex; align-items: center; gap: 0.75rem; color: var(--primary); font-weight: 600; text-decoration: none; padding: 0.75rem 0;">
                    <i class="fa-solid fa-table-columns"></i> Dashboard
                </a>
                <a href="#" id="logoutSide" style="display: flex; align-items: center; gap: 0.75rem; color: var(--text-muted); text-decoration: none; padding: 0.75rem 0; margin-top: 2rem;">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <div>
                    <h2 style="font-size: 1.5rem; font-weight: 700;">Inquiry Overview</h2>
                    <p style="color: var(--text-muted); font-size: 0.875rem;">Manage all incoming leads from theme_migration</p>
                </div>
                <div class="user-nav">
                    <button class="logout-btn" id="logoutBtn">Logout</button>
                </div>
            </header>

            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Inquiries</h3>
                    <div class="value" id="totalCount">0</div>
                </div>
                <div class="stat-card">
                    <h3>New Leads</h3>
                    <div class="value" id="newCount" style="color: var(--primary);">0</div>
                </div>
                <div class="stat-card">
                    <h3>Contacted</h3>
                    <div class="value" id="contactedCount" style="color: var(--success);">0</div>
                </div>
            </div>

            <div class="table-container">
                <table id="leadsTable">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Name</th>
                            <th>Contact Info</th>
                            <th>Type</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="leadsBody">
                        <!-- Leads will be injected here -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Side Panel (Replaces Modal) -->
    <div id="sidePanel" class="side-panel">
        <div class="side-panel-content">
            <div class="side-panel-header">
                <div>
                    <h3 id="panelName">Lead Details</h3>
                    <p id="panelSource" style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px;"></p>
                </div>
                <button id="closePanel" class="btn-icon"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="side-panel-tabs">
                <button class="tab-btn active" data-tab="info">Info</button>
                <button class="tab-btn" data-tab="history">History</button>
                <button class="tab-btn" data-tab="ticket">Create Ticket</button>
            </div>

            <div class="tab-content" id="infoTab">
                <div class="info-group">
                    <label>Contact Information</label>
                    <div class="info-card">
                        <div class="info-item">
                            <i class="fa-solid fa-envelope"></i>
                            <span id="panelEmail"></span>
                        </div>
                        <div class="info-item">
                            <i class="fa-solid fa-phone"></i>
                            <span id="panelPhone"></span>
                        </div>
                    </div>
                </div>

                <div class="info-group">
                    <label>Message / Requirement</label>
                    <div id="panelMessage" class="message-box"></div>
                </div>

                <div style="margin-top: 2rem; display: flex; gap: 1rem;">
                    <button id="markContacted" style="flex: 1;">Mark Contacted</button>
                    <button id="openChat" class="btn-secondary" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                        <i class="fa-brands fa-whatsapp"></i> Chat
                    </button>
                </div>
            </div>

            <div class="tab-content" id="historyTab" style="display: none;">
                <div class="history-timeline" id="historyTimeline">
                    <!-- History items will be injected here -->
                </div>
            </div>

            <div class="tab-content" id="ticketTab" style="display: none;">
                <form id="ticketForm" class="ticket-form">
                    <div class="form-group">
                        <label>Issue Description</label>
                        <textarea id="ticketIssue" placeholder="Describe the customer's problem..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Additional Numbers (Optional)</label>
                        <input type="text" id="ticketAltPhone" placeholder="e.g. 9876543210, 8877665544">
                    </div>
                    <div class="form-group">
                        <label>Estimated Resolution Time</label>
                        <select id="ticketEta">
                            <option value="2 hours">2 Hours</option>
                            <option value="24 hours">24 Hours</option>
                            <option value="2-3 days">2-3 Days</option>
                            <option value="1 week">1 Week</option>
                        </select>
                    </div>
                    <button type="submit" id="createTicketBtn" style="width: 100%;">Generate Ticket & Send WhatsApp</button>
                </form>

                <div id="ticketSuccess" style="display: none; margin-top: 1.5rem; text-align: center; background: var(--success-bg); border: 1px solid var(--success); padding: 1.5rem; border-radius: 1rem;">
                    <i class="fa-solid fa-circle-check" style="font-size: 2rem; color: var(--success); margin-bottom: 1rem; display: block;"></i>
                    <h4 style="color: var(--success);">Ticket Created!</h4>
                    <p style="font-size: 0.875rem; margin: 0.5rem 0;">ID: <strong id="generatedTicketId">#CW-10234</strong></p>
                    <p style="font-size: 0.75rem; color: var(--text-muted);">A confirmation message has been sent to the customer.</p>
                </div>
            </div>
        </div>
    </div>

    <div id="panelOverlay" class="panel-overlay"></div>

    <script src="app.js"></script>
</body>
</html>
